<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Portfolio - Redirecting...</title>
	<script type="text/javascript">
		// Single Page Apps for GitHub Pages
		// MIT License
		// https://github.com/rafgraph/spa-github-pages
		var l = window.location
		var portfolioPath = '/portfolio'

		// Save the full path including /portfolio/
		sessionStorage.redirect = l.pathname + l.search + l.hash

		// Ensure we keep the /portfolio/ part in the path
		var newPath = portfolioPath + '/?returnTo=' +
			l.pathname.replace(portfolioPath, '') +
			(l.search || '') +
			(l.hash || '')

		l.replace(
			l.protocol + '//' + l.hostname +
			(l.port ? ':' + l.port : '') +
			newPath
		);
	</script>
</head>

<body>
	<h1>Redirecting...</h1>
	<p>If you are not redirected automatically, follow this <a href="/portfolio">link</a>.</p>
</body>

</html>
