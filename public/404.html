<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Portfolio</title>
	<script type="text/javascript">
		// Единый код для обработки маршрутизации на GitHub Pages
		(function (l) {
			if (l.search[1] === '/') {
				var decoded = l.search.slice(1).split('&').map(function (s) {
					return s.replace(/~and~/g, '&')
				}).join('?')
				window.history.replaceState(null, null,
					l.pathname.slice(0, -1) + decoded + l.hash
				)
			}
		}(window.location))
	</script>
</head>

<body>
	<h1>Redirecting...</h1>
	<p>If you are not redirected automatically, follow this <a href="/portfolio">link</a>.</p>
</body>

</html>
