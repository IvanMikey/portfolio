<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Portfolio</title>
	<script type="text/javascript">
		// Обработка маршрутизации для GitHub Pages
		(function (l) {
			if (l.pathname !== '/portfolio/' && l.pathname !== '/portfolio') {
				// Сохраняем полный путь
				sessionStorage.redirect = l.pathname + l.search + l.hash
				// Перенаправляем на корневой путь
				l.replace(
					l.protocol + '//' + l.hostname +
					(l.port ? ':' + l.port : '') +
					'/portfolio/'
				)
			}
		}(window.location))
	</script>
</head>

<body>
	<h1>Redirecting...</h1>
	<p>If you are not redirected automatically, follow this <a href="/portfolio">link</a>.</p>
</body>

</html>
