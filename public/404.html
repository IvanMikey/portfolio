<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Portfolio - Redirecting...</title>
	<script type="text/javascript">
		// Single Page Apps for GitHub Pages
		// MIT License
		// https://github.com/rafgraph/spa-github-pages
		var segmentCount = 1
		var l = window.location

		// Сохраняем текущий путь в sessionStorage
		sessionStorage.redirect = l.pathname + l.search + l.hash

		l.replace(
			l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
			l.pathname.split('/').slice(0, segmentCount + 1).join('/') + '/?p=/' +
			l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
			(l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
			l.hash
		);
	</script>
</head>

<body>
	<h1>Redirecting...</h1>
	<p>If you are not redirected automatically, follow this <a href="/portfolio">link</a>.</p>
</body>

</html>
